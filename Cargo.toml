[workspace]
resolver = "2"
members = ["crates/*"]
# Standalone example crate: needs coverage rustflags, built on its own.
exclude = ["examples/locate-demo"]

[workspace.package]
repository = "https://github.com/alpaylan/crabcheck"
license = "MIT"
authors = [
    "Alperen Keles <akeles@umd.edu>",
    "Umut Şahin <umutsahin@protonmail.com>",
]
rust-version = "1.88"
