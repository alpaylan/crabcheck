[package]
name = "crabcheck"
description = "Property-based testing with choice-tree shrinking, targeted mutation, and seed replay, designed for tests written by coding agents"
version = "0.2.0-dev"
edition = "2024"
categories = ["development-tools::testing"]
keywords = ["property-based-testing", "pbt", "quickcheck", "shrinking", "fuzzing"]
readme = "README.md"
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = ["json", "derive"]
# JSON reports, config files and the regressions file (serde + serde_json).
json = ["dep:serde", "dep:serde_json"]
# `#[derive(Arbitrary)]` and `#[crabcheck::test]`.
derive = ["dep:crabcheck-macros"]
# In-process LLVM coverage counters (needs `-C instrument-coverage` on the
# final build; detected by the build script).
coverage = ["dep:rustc-demangle", "dep:miniz_oxide", "dep:object"]
# Assume the build is instrumented even when the build script cannot see
# the flag (profile rustflags, `cargo rustc -- ...`).
coverage-force = ["coverage"]
# The `crabcheck serve` command: a local page over coverage grids, reports
# and targets.
serve = ["json"]

[[bin]]
name = "crabcheck"
path = "src/bin/crabcheck.rs"
required-features = ["serve"]

[dependencies]
rustc-demangle = { version = "0.1", optional = true }
miniz_oxide = { version = "0.8", optional = true }
object = { version = "0.40", optional = true, default-features = false, features = ["read", "std"] }
crabcheck-macros = { version = "0.2.0-dev", path = "../crabcheck-macros", optional = true }
rand_core = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
insta = { version = "1.48", features = ["filters"] }
serde_json = "1.0"

[lints.rust]
missing_docs = "warn"
