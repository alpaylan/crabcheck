name: CI
on:
  pull_request:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

env:
  # Snapshot drift fails the build; accept changes locally with `cargo insta review`.
  INSTA_UPDATE: "no"

jobs:
  fmt:
    name: Format (nightly rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p crabcheck --all-targets --no-default-features -- -D warnings
      - run: cargo clippy -p crabcheck --all-targets --features serve -- -D warnings
      - run: cargo clippy -p crabcheck-locate --lib --bins --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  features:
    name: Feature matrix (crabcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p crabcheck --no-default-features
      - run: cargo build -p crabcheck --no-default-features --features json
      - run: cargo build -p crabcheck --no-default-features --features derive
      # The library builds with every feature; test binaries do not link
      # uninstrumented, since coverage-force assumes instrumentation. They
      # are tested under instrumentation in the coverage job.
      - run: cargo build -p crabcheck --all-features
      - run: cargo test -p crabcheck --no-default-features
      - run: cargo test -p crabcheck --no-default-features --features coverage
      - run: cargo test -p crabcheck --no-default-features --features derive
      - run: cargo test -p crabcheck --features serve

  coverage:
    name: Coverage feature (instrumented and not)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Uninstrumented build still compiles and runs
        run: cargo test -p crabcheck --features coverage,serve
      - name: Instrumented build reads counters in-process
        run: cargo test -p crabcheck --features coverage,serve
        env:
          RUSTFLAGS: -C instrument-coverage
          RUST_TEST_THREADS: 1
      - name: Every feature at once, instrumented (coverage-force links here)
        run: cargo test -p crabcheck --all-features
        env:
          RUSTFLAGS: -C instrument-coverage
          RUST_TEST_THREADS: 1

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  package:
    name: Package contents guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Only source, manifest, README, CHANGELOG and LICENSE may ship
        run: |
          cargo package -p crabcheck --list --allow-dirty | tee package.txt
          if grep -vE '^(src/|tests/|build\.rs$|Cargo\.toml$|Cargo\.toml\.orig$|Cargo\.lock$|\.cargo_vcs_info\.json$|README\.md$|CHANGELOG\.md$|LICENSE$)' package.txt; then
            echo "::error::unexpected files in package (see above)"; exit 1
          fi
      - name: Build and test a consumer against the packaged crates
        run: ci/package-smoke.sh

  locate-demo:
    name: locate-demo (coverage-instrumented)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/locate-demo
      # The demo's .cargo/config.toml supplies -C instrument-coverage, but
      # any RUSTFLAGS in the environment, even an empty one, replaces the
      # config's flags, and the workflow sets RUSTFLAGS globally; so the
      # flag is repeated here.
      - run: cargo test
        working-directory: examples/locate-demo
        env:
          RUSTFLAGS: -D warnings -C instrument-coverage
          RUST_TEST_THREADS: "1"
      - run: cargo run
        working-directory: examples/locate-demo
        env:
          RUSTFLAGS: -D warnings -C instrument-coverage

  publish:
    name: Publish crabcheck
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, features, coverage, msrv, docs, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # crabcheck depends on crabcheck-macros by exact version, so the
      # macros crate goes first; cargo waits for it to be indexed.
      - run: cargo publish -p crabcheck-macros --token ${{ secrets.REGISTRY_TOKEN }}
      - run: cargo publish -p crabcheck --token ${{ secrets.REGISTRY_TOKEN }}
