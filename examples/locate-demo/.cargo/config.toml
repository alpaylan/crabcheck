# Coverage instrumentation flags for fault localization. Required for
# `crabcheck_locate::quickcheck_with_locate!` to produce useful suspect rankings.
# Without these, the binary lacks the `__llvm_profile_*` symbols and the
# coverage map needed by `llvm-cov export`.
[build]
rustflags = [
    "-C", "instrument-coverage",
    "-C", "link-dead-code",
    "-C", "codegen-units=1",
    "-C", "llvm-args=-inline-threshold=0",
    "-C", "debuginfo=2",
]
